<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>HALF-LIFE 2 // WEB</title>

    <link rel="icon" href="data:image/x-icon;base64,AAABAAEAEBAQAAAAAAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAgAAAAIAAA">

    <script src="coi-serviceworker.js"></script>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background-color: #0b0c0e; color: #d8dde3;
        font-family: monospace, -apple-system;
      }
      #canvas {
        width: 100vw; height: 100vh; display: block;
        position: absolute; top: 0; left: 0; outline: none; background: #000;
      }
      #launcher-ui {
        position: fixed; inset: 0; z-index: 50;
        background: radial-gradient(circle at 50% 45%, #1c1815 0%, #0d0c0a 70%, #050504 100%);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 2rem;
      }
      #launcher-ui.hidden { display: none !important; }
      .terminal-frame {
        position: relative; z-index: 52;
        background: rgba(18, 17, 16, 0.95); border: 1px solid #332d28; border-top: 3px solid #ff7b00;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        width: 100%; max-width: 580px; padding: 2.2rem;
      }
      .brand-title { font-size: 2rem; font-weight: 900; color: #f7ede2; letter-spacing: 0.15em; }
      .brand-sub { font-size: 0.75rem; color: #ffa200; margin-bottom: 1.2rem; font-weight: 700; }
      .btn-terminal {
        width: 100%; background: #ff7b00; color: #120e0a; border: 1px solid #ff7b00;
        padding: 1rem; font-family: inherit; font-size: 0.88rem; font-weight: 800;
        letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
      }
      .btn-terminal:hover:not(:disabled) { background: #ffa200; }
      .btn-terminal:disabled { background: #1a1715; border-color: #2b2520; color: #595048; cursor: not-allowed; }
      #progress-box { display: none; margin-top: 1.4rem; }
      .meter-labels { display: flex; justify-content: space-between; font-size: 0.74rem; color: #8c827a; margin-bottom: 0.4rem; }
      .meter-rail { width: 100%; height: 8px; background: #080706; border: 1px solid #2b2520; overflow: hidden; }
      .meter-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #d45b00, #ff7b00); transition: width 0.08s linear; }
      .meter-sub { display: flex; justify-content: space-between; font-size: 0.68rem; color: #595048; margin-top: 0.45rem; }
      #crash-overlay {
        position: fixed; inset: 0; z-index: 100; background: rgba(8, 7, 6, 0.95);
        display: none; align-items: center; justify-content: center; padding: 2rem;
      }
      #crash-overlay.active { display: flex !important; }
      .crash-card { background: #141210; border: 1px solid #e63946; max-width: 680px; width: 100%; padding: 1.8rem; }
      .crash-pre { background: #080706; color: #ff858d; font-size: 0.75rem; padding: 1rem; max-height: 260px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 1.2rem; }
    </style>
  </head>
  <body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="launcher-ui">
      <div class="terminal-frame">
        <div class="brand-title">HALF-LIFE 2</div>
        <div class="brand-sub">SOURCE ENGINE // WASM RUNTIME</div>

        <button id="btn-start" class="btn-terminal" onclick="startApp()" disabled>AWAITING ISOLATION...</button>

        <div id="progress-box">
          <div class="meter-labels">
            <span id="txt-status">STREAMING ASSETS</span>
            <span id="txt-pct">0%</span>
          </div>
          <div class="meter-rail"><div id="bar-fill" class="meter-fill"></div></div>
          <div class="meter-sub">
            <span id="txt-file">Mounting system modules...</span>
            <span id="txt-bytes">0 MB / 420 MB</span>
          </div>
        </div>
      </div>
    </div>

    <div id="crash-overlay">
      <div class="crash-card">
        <h3 style="color:#e63946;margin-bottom:0.8rem;">RUNTIME ERROR</h3>
        <pre id="crash-log" class="crash-pre"></pre>
        <button class="btn-terminal" onclick="location.reload()">RELOAD</button>
      </div>
    </div>

    <script type="text/javascript">
      // Global elements required by DataLoader
      window.spinnerElement = document.createElement('div');
      window.statusElement = document.createElement('div');
      window.progressElement = document.createElement('progress');

      const SPLIT_FILES = {
        'background01.data': 5,
        'd1_canals_01.data': 2,
        'd1_canals_01a.data': 2,
        'd1_canals_07.data': 2,
        'd1_canals_11.data': 2,
        'd1_eli_01.data': 2,
        'd1_trainstation_01.data': 3,
        'd1_trainstation_02.data': 2,
        'd1_trainstation_03.data': 2,
        'd1_trainstation_04.data': 2,
        'd1_trainstation_05.data': 5,
        'd2_coast_03.data': 2,
        'd2_coast_09.data': 2
      };

      const canvasElement = document.getElementById('canvas');
      const launcherUi = document.getElementById('launcher-ui');
      const btnStart = document.getElementById('btn-start');
      const progressBox = document.getElementById('progress-box');
      const txtStatus = document.getElementById('txt-status');
      const txtPct = document.getElementById('txt-pct');
      const barFill = document.getElementById('bar-fill');
      const txtFile = document.getElementById('txt-file');
      const txtBytes = document.getElementById('txt-bytes');
      const crashOverlay = document.getElementById('crash-overlay');
      const crashLog = document.getElementById('crash-log');

      let g_totalExpected = 420 * 1024 * 1024;
      let g_downloaded = 0;
      let g_launched = false;
      let g_engineInitialized = false;

      // Pointer Lock: ensure cursor recovers cleanly on Escape
      document.addEventListener('pointerlockchange', () => {
        canvasElement.style.cursor = (document.pointerLockElement === canvasElement) ? 'none' : 'default';
      });

      canvasElement.addEventListener('click', () => {
        if (g_engineInitialized && document.pointerLockElement !== canvasElement) {
          try { canvasElement.requestPointerLock(); } catch(e) {}
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape' && document.pointerLockElement) {
          document.exitPointerLock();
          canvasElement.style.cursor = 'default';
        }
      });

      function updateUI(status, file, bytesAdded) {
        if (status) txtStatus.textContent = status;
        if (file) txtFile.textContent = file;
        if (bytesAdded) g_downloaded += bytesAdded;

        const dlMB = (g_downloaded / 1048576).toFixed(1);
        const totMB = (g_totalExpected / 1048576).toFixed(1);
        txtBytes.textContent = `${dlMB} MB / ${totMB} MB`;

        const pct = Math.min(99, Math.round((g_downloaded / g_totalExpected) * 100));
        txtPct.textContent = `${pct}%`;
        barFill.style.width = `${pct}%`;
      }

      function showCrash(err) {
        crashLog.textContent = (err && err.stack) ? err.stack : (err && err.message ? err.message : String(err));
        crashOverlay.classList.add('active');
        canvasElement.style.cursor = 'default';
      }

      window.onerror = (m, u, l, c, e) => showCrash(e || m);
      window.onunhandledrejection = (e) => showCrash(e.reason);

      // Chunk fetcher & stitcher
      async function fetchPart(baseName, partIdx) {
        const pad4 = String(partIdx).padStart(4, '0');
        const paths = [`chunks/${baseName}.part${pad4}`, `${baseName}.part${pad4}`];
        for (const p of paths) {
          try {
            const res = await origFetch(p);
            if (res.ok) {
              const buf = await res.arrayBuffer();
              updateUI(undefined, `${baseName} (.part${pad4})`, buf.byteLength);
              return buf;
            }
          } catch(e) {}
        }
        throw new Error(`Failed to locate chunk: ${baseName}.part${pad4}`);
      }

      const g_chunkAssembly = {};
      async function assembleSplit(splitInfo) {
        const { baseName, totalParts } = splitInfo;
        if (g_chunkAssembly[baseName]) return g_chunkAssembly[baseName];

        g_chunkAssembly[baseName] = (async () => {
          const buffers = [];
          let totalLen = 0;
          for (let i = 1; i <= totalParts; i++) {
            updateUI('ASSEMBLING', `${baseName} (${i}/${totalParts})`);
            const b = await fetchPart(baseName, i);
            buffers.push(b);
            totalLen += b.byteLength;
          }
          const combined = new Uint8Array(totalLen);
          let offset = 0;
          for (let i = 0; i < buffers.length; i++) {
            combined.set(new Uint8Array(buffers[i]), offset);
            offset += buffers[i].byteLength;
            buffers[i] = null;
          }
          return combined.buffer;
        })();
        return g_chunkAssembly[baseName];
      }

      function getSplitTarget(url) {
        if (!url) return null;
        for (const [baseName, totalParts] of Object.entries(SPLIT_FILES)) {
          if (url.includes(baseName)) return { baseName, totalParts };
        }
        return null;
      }

      const origFetch = window.fetch.bind(window);
      window.fetch = async function(input, init) {
        const url = (typeof input === 'string') ? input : (input && input.url ? input.url : '');
        const split = getSplitTarget(url);
        if (split) {
          try {
            const assembled = await assembleSplit(split);
            return new Response(assembled, { status: 200, statusText: 'OK' });
          } catch(e) {
            return new Response(new ArrayBuffer(0), { status: 200, statusText: 'OK' });
          }
        }
        return origFetch(input, init);
      };

      const OrigXHR = window.XMLHttpRequest;
      window.XMLHttpRequest = function() {
        const xhr = new OrigXHR();
        let targetUrl = '';
        const origOpen = xhr.open;
        xhr.open = function(method, url, ...rest) {
          targetUrl = url;
          return origOpen.call(this, method, url, ...rest);
        };
        const origSend = xhr.send;
        xhr.send = function(body) {
          const split = getSplitTarget(targetUrl);
          if (split) {
            assembleSplit(split).then(buffer => {
              Object.defineProperty(xhr, 'status', { get: () => 200 });
              Object.defineProperty(xhr, 'statusText', { get: () => 'OK' });
              Object.defineProperty(xhr, 'readyState', { get: () => 4 });
              Object.defineProperty(xhr, 'response', { get: () => buffer });
              const evt = new ProgressEvent('load', { loaded: buffer.byteLength, total: buffer.byteLength, lengthComputable: true });
              if (typeof xhr.onload === 'function') xhr.onload(evt);
              else xhr.dispatchEvent(evt);
            }).catch(() => {
              if (typeof xhr.onerror === 'function') xhr.onerror(new ProgressEvent('error'));
            });
            return;
          }
          return origSend.call(this, body);
        };
        return xhr;
      };

      // Configure Module directly matching hl2_launcher needs
      window.Module = {
        canvas: canvasElement,
        locateFile: (path) => path,
        mainScriptUrlOrBlob: new URL('hl2_launcher.js', window.location.href).href,
        totalDependencies: 0,
        spinner: window.spinnerElement,
        statusElement: window.statusElement,
        progressElement: window.progressElement,
        setStatus: (text) => {
          if (text) updateUI('INITIALIZING', text);
        },
        print: function(text) {
          console.log(text);
          if (text.includes('Host_Init') || text.includes('d1_trainstation_01') || text.includes('background01')) {
            txtPct.textContent = '100%';
            barFill.style.width = '100%';
            updateUI('READY', 'Chamber Loaded');
            setTimeout(() => {
              launcherUi.classList.add('hidden');
              g_engineInitialized = true;
              canvasElement.focus();
            }, 600);
          }
        },
        printErr: function(text) {
          console.error(text);
          if (/abort|assertion failed/i.test(text)) showCrash(text);
        }
      };

      function checkIsolation() {
        if (window.crossOriginIsolated) {
          btnStart.disabled = false;
          btnStart.textContent = 'START ENGINE';
        } else {
          btnStart.disabled = true;
          btnStart.textContent = 'AWAITING ISOLATION...';
        }
      }

      checkIsolation();
      setInterval(checkIsolation, 500);

      function startApp() {
        if (!window.crossOriginIsolated) return;
        if (g_launched) return;
        g_launched = true;

        btnStart.style.display = 'none';
        progressBox.style.display = 'block';
        updateUI('STARTING', 'Mounting hl2_launcher.js...');

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'hl2_launcher.js';
        script.onerror = () => showCrash('Failed to load hl2_launcher.js');
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
