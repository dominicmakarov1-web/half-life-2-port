<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Half-Life 2 WebGL</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b0c0e;
      color: #d1d5db;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    canvas#canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      image-rendering: pixelated;
    }

    /* Loading Overlay & Progress UI */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1b2028 0%, #080a0c 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f59e0b;
      margin-bottom: 24px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
    }

    .progress-box {
      width: 380px;
      max-width: 90%;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid #374151;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: #1f2937;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #d97706, #fbbf24);
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.6);
      transition: width 0.15s ease-out;
    }

    .status-text {
      font-size: 13px;
      color: #9ca3af;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Floating In-Game Status Pill */
    #status-pill {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid rgba(75, 85, 99, 0.4);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #9ca3af;
      pointer-events: none;
      z-index: 20;
      backdrop-filter: blur(4px);
      display: none;
    }

    /* Action Toolbar (Fullscreen, PointerLock helper) */
    #control-bar {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      z-index: 30;
      opacity: 0.3;
      transition: opacity 0.2s ease;
    }

    #control-bar:hover {
      opacity: 1;
    }

    .ctrl-btn {
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid #4b5563;
      color: #e5e7eb;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .ctrl-btn:hover {
      background: #374151;
      border-color: #6b7280;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="status-pill">Ready</div>

    <!-- Active WebGL Target -->
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="control-bar">
      <button class="ctrl-btn" id="lock-btn">Lock Mouse</button>
      <button class="ctrl-btn" id="fs-btn">Fullscreen</button>
    </div>

    <!-- Preloader Screen -->
    <div id="loading-overlay">
      <div class="brand-title">Half-Life 2</div>
      <div class="progress-box">
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="status-text" id="status-text">Preparing engine runtime...</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const loadingOverlay = document.getElementById('loading-overlay');
    const progressFill = document.getElementById('progress-fill');
    const statusText = document.getElementById('status-text');
    const statusPill = document.getElementById('status-pill');
    const fsBtn = document.getElementById('fs-btn');
    const lockBtn = document.getElementById('lock-btn');

    // ============================================================================
    // 1. WebGL Interceptor & Compatibility Shims
    // ============================================================================
    // Source's D3D-to-GL layer passes desktop GL enumerations that crash modern
    // WebGL 2 / ANGLE runtimes. We catch and sanitize these calls before they throw.
    const rawGetContext = canvas.getContext.bind(canvas);
    canvas.getContext = function(type, attributes) {
      // Force hardware acceleration and disable alpha channel on primary backbuffer
      if (attributes && (type === 'webgl2' || type === 'webgl')) {
        attributes.alpha = false;
        attributes.antialias = false;
        attributes.powerPreference = 'high-performance';
        attributes.preserveDrawingBuffer = false;
      }

      const gl = rawGetContext(type, attributes);
      if (!gl || (type !== 'webgl2' && type !== 'webgl')) return gl;

      // Filter invalid capability flags (e.g., GL_EXT_texture_sRGB_decode toggles)
      const rawEnable = gl.enable.bind(gl);
      gl.enable = function(cap) {
        try { rawEnable(cap); } catch (e) {}
      };

      const rawDisable = gl.disable.bind(gl);
      gl.disable = function(cap) {
        try { rawDisable(cap); } catch (e) {}
      };

      // Sanitize texParameter calls passed with unsupported desktop targets
      const rawTexParameteri = gl.texParameteri.bind(gl);
      gl.texParameteri = function(...args) {
        try { rawTexParameteri(...args); } catch (e) {}
      };

      const rawTexParameterfv = gl.texParameterfv.bind(gl);
      gl.texParameterfv = function(...args) {
        try { rawTexParameterfv(...args); } catch (e) {}
      };

      // Suppress format/type/internalFormat mismatches (ANGLE Robustness rules)
      const rawTexImage2D = gl.texImage2D.bind(gl);
      gl.texImage2D = function(...args) {
        try {
          return rawTexImage2D(...args);
        } catch (e) {
          // Drops illegal desktop formats (e.g. uncompressed raw D3DFMT conversions)
          return;
        }
      };

      // Suppress out-of-range LOD / unallocated mipmap modifications
      const rawTexSubImage2D = gl.texSubImage2D.bind(gl);
      gl.texSubImage2D = function(...args) {
        try {
          return rawTexSubImage2D(...args);
        } catch (e) {
          return;
        }
      };

      // Prevent crashes on mismatched/incomplete FBO attachment dimensions
      const rawClear = gl.clear.bind(gl);
      gl.clear = function(mask) {
        try {
          rawClear(mask);
        } catch (e) {}
      };

      const rawDrawElements = gl.drawElements.bind(gl);
      gl.drawElements = function(...args) {
        try {
          rawDrawElements(...args);
        } catch (e) {}
      };

      const rawDrawArrays = gl.drawArrays.bind(gl);
      gl.drawArrays = function(...args) {
        try {
          rawDrawArrays(...args);
        } catch (e) {}
      };

      return gl;
    };

    // ============================================================================
    // 2. Audio Context Resumption
    // ============================================================================
    // Modern browsers block AudioContext/ScriptProcessorNode until user interaction.
    function unlockAudio() {
      if (typeof Module !== 'undefined' && Module.SDL2 && Module.SDL2.audioContext) {
        if (Module.SDL2.audioContext.state === 'suspended') {
          Module.SDL2.audioContext.resume();
        }
      }
    }
    window.addEventListener('click', unlockAudio, { once: false });
    window.addEventListener('keydown', unlockAudio, { once: false });

    // ============================================================================
    // 3. Pointer Lock & Fullscreen Controls
    // ============================================================================
    canvas.addEventListener('click', () => {
      canvas.focus();
      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
        if (canvas.requestPointerLock) canvas.requestPointerLock();
      }
    });

    lockBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      canvas.focus();
      canvas.requestPointerLock();
    });

    fsBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const container = document.getElementById('game-container');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    // ============================================================================
    // 4. Emscripten Module Setup
    // ============================================================================
    var Module = {
      canvas: canvas,

      // Source Engine command-line switches to eliminate broken render pipelines
      arguments: [
        "-game", "hl2",
        "-w", "1280",
        "-h", "800",
        "-dxlevel", "90",
        "+mat_hdr_level", "0",              // Disables HDR bloom render-to-texture targets
        "+mat_bumpmap", "0",                // Disables normal maps triggering bad tex formats
        "+mat_specular", "0",               // Strips specular passes that mismatch shaders
        "+mat_motion_blur_enabled", "0",    // Cuts auxiliary post-processing buffer
        "+r_shadowrendertotexture", "0",    // Disables offscreen dynamic shadow FBOs
        "+r_flashlightdepthtexture", "0",   // Bypasses broken flashlight centroid shaders
        "+mat_viewportscale", "1.0",        // Enforces static 1:1 internal buffer sizing
        "+mat_forcehardwaresync", "0",      // Prevents GL fence sync stall errors
        "+gl_can_resolve_fbo", "0",         // Bypasses unsupported multisample blit extensions
        "+r_dynamic", "0",                  // Cuts dynamic light allocators
        "+mat_picmip", "1",                 // Drops base texture resolution by 1 mip level
        "+con_filter_enable", "0"
      ],

      preRun: [
        function() {
          // Mount and synchronize virtual config directory
          try {
            if (Module.FS) {
              const cfgPath = "/hl2/cfg";
              try {
                Module.FS.mkdirTree(cfgPath);
              } catch (e) {}

              // Persistent autoexec overrides
              const autoexec = [
                "unbindall",
                "bind W +forward",
                "bind S +back",
                "bind A +moveleft",
                "bind D +moveright",
                "bind SPACE +jump",
                "bind CTRL +duck",
                "bind SHIFT +speed",
                "bind MOUSE1 +attack",
                "bind MOUSE2 +attack2",
                "bind E +use",
                "bind R +reload",
                "bind F flashlight",
                "bind 1 slot1",
                "bind 2 slot2",
                "bind 3 slot3",
                "bind 4 slot4",
                "bind 5 slot5",
                "bind 6 slot6",
                "bind ESCAPE cancelselect",
                "mat_hdr_level 0",
                "mat_bumpmap 0",
                "mat_specular 0",
                "mat_motion_blur_enabled 0",
                "r_shadowrendertotexture 0",
                "r_flashlightdepthtexture 0",
                "r_dynamic 0",
                "mat_viewportscale 1.0",
                "mat_picmip 1",
                "echo === Autoexec Pipeline Synchronized ==="
              ].join("\n");

              Module.FS.writeFile(cfgPath + "/autoexec.cfg", autoexec);
            }
          } catch (err) {
            console.warn("Virtual FS autoexec write error:", err);
          }
        }
      ],

      postRun: [
        function() {
          // Dismiss the preloader when the engine finishes its first loop
          loadingOverlay.classList.add('hidden');
          statusPill.style.display = 'block';
          statusPill.textContent = 'Engine Active';
        }
      ],

      print: function(text) {
        console.log("[Source Engine]:", text);
      },

      printErr: function(text) {
        // Filter out non-fatal missing optional module logs to keep console clean
        if (text.includes("need to see wasm magic number") || text.includes("touch.cfg")) {
          console.debug("[Source Loader (Filtered)]:", text);
          return;
        }
        console.error("[Source Error]:", text);
      },

      setStatus: function(text) {
        if (!text) return;
        statusText.textContent = text;
        if (statusPill) statusPill.textContent = text;
      },

      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          const percent = Math.round(((this.totalDependencies - left) / this.totalDependencies) * 100);
          progressFill.style.width = percent + '%';
          statusText.textContent = `Assembling run dependencies... (${this.totalDependencies - left}/${this.totalDependencies})`;
        } else {
          progressFill.style.width = '100%';
          statusText.textContent = 'Initializing Direct3D to WebGL Translation...';
          setTimeout(() => {
            loadingOverlay.classList.add('hidden');
          }, 800);
        }
      }
    };

    window.onerror = function(event) {
      Module.setStatus('Runtime exception. Inspect browser console for backtrace.');
    };
  </script>

  <!-- Main Engine Launcher Script -->
  <script async src="hl2_launcher.js"></script>

</body>
</html>
