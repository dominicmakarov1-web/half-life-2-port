<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Half-Life 2 Web</title>
  <script src="coi-serviceworker.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #ccc;
      font-family: monospace;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0d0f12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .progress-bar-wrap {
      width: 340px;
      max-width: 85%;
      height: 10px;
      background: #1f242d;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid #374151;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #f59e0b;
      transition: width 0.1s linear;
    }
    .status {
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="loading-overlay">
      <div class="title">HALF-LIFE 2</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="status" id="status-label">Initializing virtual runtime...</div>
    </div>
  </div>

  <script>
    // 1. Fix ReferenceError: canvasElement is not defined
    const canvas = document.getElementById('canvas');
    window.canvasElement = canvas;
    window.canvas = canvas;

    const overlay = document.getElementById('loading-overlay');
    const progressBar = document.getElementById('progress-bar');
    const statusLabel = document.getElementById('status-label');

    // 2. WebGL Compatibility Layer for Source Engine Desktop GL Calls
    const origGetContext = canvas.getContext.bind(canvas);
    canvas.getContext = function(type, attributes) {
      if (attributes && (type === 'webgl2' || type === 'webgl')) {
        attributes.alpha = false;
        attributes.antialias = false;
        attributes.powerPreference = 'high-performance';
      }
      const gl = origGetContext(type, attributes);
      if (!gl) return gl;

      const rawEnable = gl.enable.bind(gl);
      gl.enable = function(cap) { try { rawEnable(cap); } catch (e) {} };

      const rawDisable = gl.disable.bind(gl);
      gl.disable = function(cap) { try { rawDisable(cap); } catch (e) {} };

      const rawTexImage2D = gl.texImage2D.bind(gl);
      gl.texImage2D = function(...args) {
        try { return rawTexImage2D(...args); } catch (e) { return; }
      };

      const rawTexSubImage2D = gl.texSubImage2D.bind(gl);
      gl.texSubImage2D = function(...args) {
        try { return rawTexSubImage2D(...args); } catch (e) { return; }
      };

      const rawClear = gl.clear.bind(gl);
      gl.clear = function(m) { try { rawClear(m); } catch (e) {} };

      const rawDrawElements = gl.drawElements.bind(gl);
      gl.drawElements = function(...args) { try { rawDrawElements(...args); } catch (e) {} };

      return gl;
    };

    // 3. Audio unlock helper
    function unlockAudio() {
      if (typeof Module !== 'undefined' && Module.SDL2 && Module.SDL2.audioContext) {
        if (Module.SDL2.audioContext.state === 'suspended') {
          Module.SDL2.audioContext.resume();
        }
      }
    }
    window.addEventListener('click', unlockAudio, { once: false });
    window.addEventListener('keydown', unlockAudio, { once: false });

    // 4. Asset Stitching & Mounting Routine
    async function fetchBinary(url) {
      const resp = await fetch(url);
      if (!resp.ok) throw new Error(`HTTP ${resp.status} on ${url}`);
      return new Uint8Array(await resp.arrayBuffer());
    }

    async function loadChunkParts(baseName, partCount) {
      const parts = [];
      let totalLength = 0;
      for (let i = 1; i <= partCount; i++) {
        const pad = String(i).padStart(4, '0');
        statusLabel.textContent = `Downloading ${baseName} (part ${i}/${partCount})...`;
        const data = await fetchBinary(`chunks/${baseName}.part${pad}`);
        parts.push(data);
        totalLength += data.length;
      }
      const full = new Uint8Array(totalLength);
      let offset = 0;
      for (const part of parts) {
        full.set(part, offset);
        offset += part.length;
      }
      return full;
    }

    // 5. Emscripten Engine Definition
    var Module = {
      canvas: canvas,
      canvasElement: canvas,

      arguments: [
        "-game", "hl2",
        "-w", "1280",
        "-h", "800",
        "-dxlevel", "90",
        "+mat_hdr_level", "0",
        "+mat_bumpmap", "0",
        "+mat_specular", "0",
        "+mat_motion_blur_enabled", "0",
        "+r_shadowrendertotexture", "0",
        "+r_flashlightdepthtexture", "0",
        "+mat_viewportscale", "1.0",
        "+mat_forcehardwaresync", "0",
        "+gl_can_resolve_fbo", "0",
        "+r_dynamic", "0"
      ],

      preRun: [
        function() {
          // Tell Emscripten to wait until our core bootstrap & background data are loaded
          addRunDependency('load_bootstrap_data');

          (async () => {
            try {
              // Ensure base directories
              const dirs = ["/hl2", "/hl2/cfg", "/hl2/custom", "/hl2/maps", "/platform"];
              dirs.forEach(d => {
                try { Module.FS.mkdirTree(d); } catch (e) {}
              });

              // Fallback baseline gameinfo.txt
              const fallbackGameInfo = 
`"GameInfo"
{
\tgame\t\t"Half-Life 2"
\ttitle\t\t"HALF-LIFE 2"
\ttype\t\tsingleplayer_only
\tFileSystem
\t{
\t\tSteamAppId\t\t\t\t220
\t\tSearchPaths
\t\t{
\t\t\tGame\t\t\t\t|gameinfo_path|.
\t\t\tGame\t\t\t\thl2
\t\t}
\t}
}
`;
              Module.FS.writeFile("/hl2/gameinfo.txt", fallbackGameInfo);

              // 1. Download and mount bootstrap.data
              statusLabel.textContent = "Downloading bootstrap.data...";
              progressBar.style.width = "20%";
              const bootstrapBuf = await fetchBinary("chunks/bootstrap.data");
              Module.FS.writeFile("/bootstrap.data", bootstrapBuf);

              // 2. Download and merge background01 menu map (5 split parts)
              progressBar.style.width = "40%";
              const bg01Buf = await loadChunkParts("background01.data", 5);
              Module.FS.writeFile("/background01.data", bg01Buf);
              progressBar.style.width = "90%";

              statusLabel.textContent = "Unpacking archives into file system...";
              console.log("[Launcher] Base chunks successfully mounted.");
            } catch (err) {
              console.error("[Launcher] Critical boot data load failure:", err);
              statusLabel.textContent = "Failed to load base asset chunks. Check console.";
            } finally {
              // Release Emscripten to boot the engine
              removeRunDependency('load_bootstrap_data');
            }
          })();
        }
      ],

      postRun: [
        function() {
          overlay.classList.add('hidden');
        }
      ],

      print: function(text) {
        console.log("[Source Engine]:", text);
      },

      printErr: function(text) {
        if (text.includes("need to see wasm magic number") || text.includes("touch.cfg")) {
          return;
        }
        console.error("[Source Error]:", text);
      },

      setStatus: function(text) {
        if (!text) return;
        statusLabel.textContent = text;
      },

      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          const p = Math.round(((this.totalDependencies - left) / this.totalDependencies) * 100);
          progressBar.style.width = p + "%";
        }
      }
    };
  </script>

  <script async src="hl2_launcher.js"></script>
</body>
</html>
