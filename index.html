<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Half-Life 2 Web</title>
  
  <link rel="icon" href="data:image/x-icon;base64,AAABAAEAEBAQAAAAAAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAgAAAAIAAA">

  <script src="coi-serviceworker.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #ccc;
      font-family: monospace;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0d0f12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .title {
      font-size: 24px;
      font-weight: bold;
      color: #f59e0b;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .progress-bar-wrap {
      width: 340px;
      max-width: 85%;
      height: 10px;
      background: #1f242d;
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid #374151;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #f59e0b;
      transition: width 0.1s linear;
    }
    .status {
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="loading-overlay">
      <div class="title">HALF-LIFE 2</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="status" id="status-label">Initializing runtime...</div>
    </div>
  </div>

  <script>
    // 1. Shims for DataLoader legacy variables (Prevents ReferenceError: spinnerElement is not defined)
    window.spinnerElement = document.createElement('div');
    window.statusElement = document.getElementById('status-label');
    window.progressElement = document.getElementById('progress-bar');

    const canvas = document.getElementById('canvas');
    window.canvasElement = canvas;
    window.canvas = canvas;

    const overlay = document.getElementById('loading-overlay');
    const progressBar = document.getElementById('progress-bar');
    const statusLabel = document.getElementById('status-label');

    // 2. WebGL Compatibility Shims
    const origGetContext = canvas.getContext.bind(canvas);
    canvas.getContext = function(type, attributes) {
      if (attributes && (type === 'webgl2' || type === 'webgl')) {
        attributes.alpha = false;
        attributes.antialias = false;
        attributes.powerPreference = 'high-performance';
      }
      const gl = origGetContext(type, attributes);
      if (!gl) return gl;

      const rawEnable = gl.enable.bind(gl);
      gl.enable = function(cap) { try { rawEnable(cap); } catch (e) {} };

      const rawDisable = gl.disable.bind(gl);
      gl.disable = function(cap) { try { rawDisable(cap); } catch (e) {} };

      const rawTexImage2D = gl.texImage2D.bind(gl);
      gl.texImage2D = function(...args) {
        try { return rawTexImage2D(...args); } catch (e) { return; }
      };

      const rawTexSubImage2D = gl.texSubImage2D.bind(gl);
      gl.texSubImage2D = function(...args) {
        try { return rawTexSubImage2D(...args); } catch (e) { return; }
      };

      const rawClear = gl.clear.bind(gl);
      gl.clear = function(m) { try { rawClear(m); } catch (e) {} };

      const rawDrawElements = gl.drawElements.bind(gl);
      gl.drawElements = function(...args) { try { rawDrawElements(...args); } catch (e) {} };

      return gl;
    };

    // 3. Audio unlock helper
    function unlockAudio() {
      if (typeof Module !== 'undefined' && Module.SDL2 && Module.SDL2.audioContext) {
        if (Module.SDL2.audioContext.state === 'suspended') {
          Module.SDL2.audioContext.resume();
        }
      }
    }
    window.addEventListener('click', unlockAudio, { once: false });
    window.addEventListener('keydown', unlockAudio, { once: false });

    // 4. Split chunk unpacker
    const SPLIT_FILES = {
      'background01.data': 5,
      'd1_canals_01.data': 2,
      'd1_canals_01a.data': 2,
      'd1_canals_07.data': 2,
      'd1_canals_11.data': 2,
      'd1_eli_01.data': 2,
      'd1_trainstation_01.data': 3,
      'd1_trainstation_02.data': 2,
      'd1_trainstation_03.data': 2,
      'd1_trainstation_04.data': 2,
      'd1_trainstation_05.data': 5,
      'd2_coast_03.data': 2,
      'd2_coast_09.data': 2
    };

    async function assembleChunks(baseName, totalParts) {
      const buffers = [];
      let totalLength = 0;
      for (let i = 1; i <= totalParts; i++) {
        const pad = String(i).padStart(4, '0');
        const res = await fetch(`chunks/${baseName}.part${pad}`);
        if (!res.ok) throw new Error(`Missing ${baseName}.part${pad}`);
        const buf = await res.arrayBuffer();
        buffers.push(buf);
        totalLength += buf.byteLength;
      }
      const combined = new Uint8Array(totalLength);
      let offset = 0;
      for (let i = 0; i < buffers.length; i++) {
        combined.set(new Uint8Array(buffers[i]), offset);
        offset += buffers[i].byteLength;
      }
      return combined.buffer;
    }

    // Intercept network requests so DataLoader fetches assembled split chunks
    const origFetch = window.fetch.bind(window);
    window.fetch = async function(input, init) {
      const url = (typeof input === 'string') ? input : (input && input.url) ? input.url : '';
      for (const [file, parts] of Object.entries(SPLIT_FILES)) {
        if (url.includes(file)) {
          try {
            const assembled = await assembleChunks(file, parts);
            return new Response(assembled, { status: 200, statusText: 'OK' });
          } catch(e) {
            console.error('[Chunk Assembly Error]:', e);
          }
        }
      }
      return origFetch(input, init);
    };

    // 5. Worker interceptor to guarantee workers load hl2_launcher.js
    const SCRIPT_URL = new URL('hl2_launcher.js', window.location.href).href;
    const OrigWorker = window.Worker;
    window.Worker = function(scriptURL, options) {
      let target = scriptURL;
      if (!target || typeof target !== 'string' || target.endsWith('index.html') || target === window.location.href) {
        target = SCRIPT_URL;
      }
      return new OrigWorker(target, options);
    };

    // 6. Emscripten Module Definition
    var Module = {
      canvas: canvas,
      canvasElement: canvas,
      locateFile: (p) => p.replace(/^.*[\\\/]/, ''),
      mainScriptUrlOrBlob: SCRIPT_URL,

      arguments: [
        "-game", "hl2",
        "-w", "1280",
        "-h", "800",
        "-dxlevel", "90",
        "+mat_hdr_level", "0",
        "+mat_bumpmap", "0",
        "+mat_specular", "0",
        "+mat_motion_blur_enabled", "0",
        "+r_shadowrendertotexture", "0",
        "+r_flashlightdepthtexture", "0",
        "+mat_viewportscale", "1.0",
        "+mat_forcehardwaresync", "0",
        "+gl_can_resolve_fbo", "0",
        "+r_dynamic", "0"
      ],

      preRun: [
        function() {
          // Automatic Dependency Release Watchdog
          // Releases load_game_data, loadDylibs, and wasm-instantiate if they hang
          setInterval(() => {
            if (typeof runDependencyTracking !== 'undefined') {
              const hungDeps = ['load_game_data', 'loadDylibs', 'wasm-instantiate', 'idbfs_init'];
              for (const dep of hungDeps) {
                if (runDependencyTracking[dep]) {
                  console.warn(`[Watchdog] Clearing hung dependency: ${dep}`);
                  try { Module.removeRunDependency(dep); } catch(e) {}
                }
              }
            }
          }, 2500);

          try {
            const dirs = ["/hl2", "/hl2/cfg", "/hl2/custom", "/hl2/maps", "/platform"];
            dirs.forEach(d => {
              try { FS.mkdirTree(d); } catch (e) {}
            });

            const fallbackGameInfo = 
`"GameInfo"
{
\tgame\t\t"Half-Life 2"
\ttitle\t\t"HALF-LIFE 2"
\ttype\t\tsingleplayer_only
\tFileSystem
\t{
\t\tSteamAppId\t\t\t\t220
\t\tSearchPaths
\t\t{
\t\t\tGame\t\t\t\t|gameinfo_path|.
\t\t\tGame\t\t\t\thl2
\t\t}
\t}
}
`;
            FS.writeFile("/hl2/gameinfo.txt", fallbackGameInfo);
          } catch(e) {}
        }
      ],

      postRun: [
        function() {
          overlay.classList.add('hidden');
        }
      ],

      print: function(text) {
        console.log("[Source Engine]:", text);
        if (text.includes("Game initializing") || text.includes("Host_Init")) {
          overlay.classList.add('hidden');
        }
      },

      printErr: function(text) {
        if (text.includes("need to see wasm magic number") || text.includes("touch.cfg")) {
          return;
        }
        console.error("[Source Error]:", text);
      },

      setStatus: function(text) {
        if (!text) return;
        statusLabel.textContent = text;
      },

      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          const p = Math.round(((this.totalDependencies - left) / this.totalDependencies) * 100);
          progressBar.style.width = p + "%";
        }
      }
    };
  </script>

  <script async src="hl2_launcher.js"></script>
</body>
</html>
